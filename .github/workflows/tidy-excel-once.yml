name: One-time Excel dependency normalization

on:
  push:
    branches:
      - bootstrap/core-v1
    paths:
      - .github/workflows/tidy-excel-once.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/core-v1
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
      - name: Normalize dependencies and formatting
        run: |
          go mod tidy
          gofmt -w $(git ls-files '*.go')
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum '*.go'
          git commit -m "build: normalize Excel dependencies and formatting"
          git push origin HEAD:bootstrap/core-v1
