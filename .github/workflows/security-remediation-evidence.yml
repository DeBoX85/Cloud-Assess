name: Temporary security remediation evidence

on:
  pull_request:
    branches:
      - bootstrap/core-v1

permissions:
  contents: read

concurrency:
  group: security-remediation-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    if: github.head_ref == 'fix/security-remediation-20261011'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '4'
    steps:
      - name: Checkout proposal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up historical Go for classified diagnostic
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: false
      - name: Record old graph and full advisories
        run: python3 scripts/security-remediation-evidence.py old
      - name: Set up first fixed Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.9'
          cache: false
      - name: Verify publisher archive and generate isolated correction
        run: python3 scripts/security-remediation-evidence.py fixed
