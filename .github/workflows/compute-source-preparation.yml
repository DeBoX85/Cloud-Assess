name: Compute source oracle preparation
on:
  pull_request:
    branches:
      - bootstrap/core-v1
permissions:
  contents: read
concurrency:
  group: compute-source-preparation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.9'
          cache: true
      - name: Format task-owned oracle and emit complete bytes
        env:
          GOTOOLCHAIN: local
        run: |
          gofmt -w internal/plugins/region/compute_sku_capture_test.go
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('internal/plugins/region/compute_sku_capture_test.go')
          raw=p.read_bytes()
          encoded=raw.hex()
          chunks=[encoded[i:i+5000] for i in range(0,len(encoded),5000)]
          for i,chunk in enumerate(chunks):
              print("COMPUTE_ORACLE_HEX "+json.dumps({"name":str(p),"sha256":hashlib.sha256(raw).hexdigest(),"index":i,"count":len(chunks),"hex":chunk}))
          PY
      - name: Focused literal source oracles and compiling controls
        env:
          GOTOOLCHAIN: local
          GOMAXPROCS: '4'
        run: |
          go test -race -count=1 -run '^TestComputeSKUSource' ./internal/plugins/region
          python3 scripts/tests/region-compute-sku-capture-mutation.py
