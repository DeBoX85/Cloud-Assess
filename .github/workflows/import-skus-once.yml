name: One-time pinned SKU import

on:
  push:
    branches:
      - bootstrap/core-v1
    paths:
      - .github/workflows/import-skus-once.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/core-v1
      - name: Import pinned SKU data
        run: |
          set -euo pipefail
          source_sha='8e4f0577f3615e6c9014c031bcad079f235369cc'
          git clone --filter=blob:none --no-checkout https://github.com/DeBoX85/azqr.git /tmp/azqr
          git -C /tmp/azqr fetch --depth=1 origin "$source_sha"
          mkdir -p internal/skus
          git -C /tmp/azqr show "$source_sha:internal/skus/known_skus.yaml" > internal/skus/known_skus.yaml
      - name: Commit imported snapshot
        run: |
          if git diff --quiet -- internal/skus/known_skus.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/skus/known_skus.yaml
          git commit -m "data: import pinned Azure VM SKU snapshot"
          git push origin HEAD:bootstrap/core-v1
