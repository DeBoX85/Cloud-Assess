name: Refresh Go dependency lock

on:
  workflow_dispatch:
  push:
    branches:
      - bootstrap/core-v1
    paths:
      - .github/go-mod-tidy-trigger

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: bootstrap/core-v1
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.8'
          cache: false

      - name: Tidy dependencies
        run: go mod tidy

      - name: Publish dependency lock update branch
        shell: bash
        run: |
          set -euo pipefail
          git add go.mod go.sum
          if git diff --cached --quiet; then
            echo "go.mod and go.sum already tidy"
            exit 0
          fi
          git config user.name "cloud-assess-bot"
          git config user.email "134433647+DeBoX85@users.noreply.github.com"
          branch="maintenance/tidy-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git commit -m "build: refresh Go dependency lock"
          git push origin "HEAD:refs/heads/$branch"
          echo "Open a PR for the dependency update: https://github.com/${GITHUB_REPOSITORY}/compare/bootstrap/core-v1...${branch}?expand=1" >> "$GITHUB_STEP_SUMMARY"
