name: Refresh Go dependency lock

on:
  workflow_dispatch:
  push:
    branches:
      - bootstrap/core-v1
    paths:
      - .github/go-mod-tidy-trigger

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: bootstrap/core-v1
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.8'
          cache: false

      - name: Tidy dependencies
        run: go mod tidy

      - name: Publish dependency lock update branch
        shell: bash
        run: bash scripts/publish-maintenance.sh tidy
