name: One-time gofmt normalization

on:
  push:
    branches:
      - bootstrap/core-v1
    paths:
      - .github/workflows/gofmt-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/core-v1
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
      - name: Format canonical result
        run: gofmt -w internal/result/result.go
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/result/result.go
          git commit -m "style: normalize canonical result with gofmt"
          git push origin HEAD:bootstrap/core-v1
